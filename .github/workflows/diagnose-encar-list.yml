name: Diagnose Encar list

# 임시 진단 전용 워크플로. 수동 실행만 가능하며
# 상태 파일 커밋, 텔레그램 전송을 하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-encar-list-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check diagnostic script
        run: node --check scripts/diagnose-encar-list.mjs

      - name: Diagnose Encar list pages
        env:
          ENCAR_SEARCH_URL_TESLA_MODEL3: ${{ vars.ENCAR_SEARCH_URL_TESLA_MODEL3 }}
          ENCAR_SEARCH_URL_TOYOTA_SIENNA: ${{ vars.ENCAR_SEARCH_URL_TOYOTA_SIENNA }}
          ENCAR_SEARCH_URL_3: ${{ vars.ENCAR_SEARCH_URL_3 }}
          ENCAR_SEARCH_URL_4: ${{ vars.ENCAR_SEARCH_URL_4 }}
          ENCAR_SEARCH_URL_5: ${{ vars.ENCAR_SEARCH_URL_5 }}
        run: node scripts/diagnose-encar-list.mjs

      - name: Verify no working tree change
        run: git diff --exit-code
