name: Sentinel-o-car Test Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run npm test
    runs-on:
      - self-hosted
      - macOS
      - ARM64

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Run npm test
        run: npm test