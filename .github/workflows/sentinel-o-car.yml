name: Sentinel-o-car

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 방식"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - send_current
          - telegram_test

permissions:
  contents: write

concurrency:
  group: sentinel-o-car-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: npm test

      - name: Scrape and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENCAR_SEARCH_URL_TESLA_MODEL3: ${{ vars.ENCAR_SEARCH_URL_TESLA_MODEL3 }}
          ENCAR_SEARCH_URL_TOYOTA_SIENNA: ${{ vars.ENCAR_SEARCH_URL_TOYOTA_SIENNA }}
          ENCAR_SEARCH_URL_3: ${{ vars.ENCAR_SEARCH_URL_3 }}
          ENCAR_SEARCH_URL_4: ${{ vars.ENCAR_SEARCH_URL_4 }}
          ENCAR_SEARCH_URL_5: ${{ vars.ENCAR_SEARCH_URL_5 }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'normal' }}
        run: npm run scrape

      - name: Commit updated state
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_mode == 'normal' }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json
          git commit -m "chore: update Sentinel-o-car watcher state [skip ci]"
          git pull --rebase
          git push
