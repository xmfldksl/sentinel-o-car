name: Self-hosted smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Environment check
        run: |
          echo "node=$(node --version)"
          echo "arch=$(uname -m)"
          echo "os=$(uname -s)"

      - name: Run tests
        run: npm test

      # Read-only diagnostic using the real collector (collectProfileListings)
      # with the project's default Node fetch path. No state write, no Telegram,
      # no commit. Search URL and HTML body are never printed.
      - name: Check Encar list access (actual collector)
        env:
          ENCAR_SEARCH_URL_TESLA_MODEL3: ${{ vars.ENCAR_SEARCH_URL_TESLA_MODEL3 }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import { collectProfileListings } from "./src/index.mjs";
          import { normalizeWatcherConfig } from "./src/runtime.mjs";

          const PROFILE_ID = "tesla-model3-long-range";
          const TARGET_LISTING_ID = "42493992";
          const STATE_PATH = "data/state.json";

          const sha256 = async (path) =>
            createHash("sha256").update(await readFile(path)).digest("hex");

          const stateBefore = await sha256(STATE_PATH);

          const rawConfig = JSON.parse(await readFile("config.json", "utf8"));
          const config = normalizeWatcherConfig(rawConfig, process.env);
          const profile = config.profiles.find((p) => p.id === PROFILE_ID);

          if (!profile) {
            throw new Error(`profile not found: ${PROFILE_ID}`);
          }

          let listingsById;
          try {
            ({ listingsById } = await collectProfileListings(profile, {
              maxPages: 1,
              requestDelayMs: 0
            }));
          } catch (error) {
            console.log("collectProfileListings=failed");
            console.log(`error=${error?.message ?? String(error)}`);
            const stateAfter = await sha256(STATE_PATH);
            console.log(`stateChanged=${stateAfter !== stateBefore}`);
            process.exit(1);
          }

          const ids = [...listingsById.keys()].map(String);
          const stateAfter = await sha256(STATE_PATH);

          console.log("collectProfileListings=ok");
          console.log(`listingCount=${ids.length}`);
          console.log(`firstFive=${ids.slice(0, 5).join(",")}`);
          console.log(`contains${TARGET_LISTING_ID}=${ids.includes(TARGET_LISTING_ID)}`);
          console.log(`stateChanged=${stateAfter !== stateBefore}`);

          if (ids.length === 0 || stateAfter !== stateBefore) {
            process.exit(1);
          }
          EOF
