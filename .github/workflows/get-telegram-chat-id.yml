name: Get Telegram group chat ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-chat-id:
    runs-on: ubuntu-latest

    steps:
      - name: Find Telegram group chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;

          if (!token) {
            throw new Error("TELEGRAM_BOT_TOKEN 저장소 Secret이 없습니다.");
          }

          const response = await fetch(
            `https://api.telegram.org/bot${token}/getUpdates`
          );

          const data = await response.json();

          if (!response.ok || !data.ok) {
            throw new Error(
              `Telegram getUpdates 실패: ${JSON.stringify(data)}`
            );
          }

          const chats = new Map();

          for (const update of data.result) {
            const message =
              update.message ??
              update.edited_message ??
              update.channel_post ??
              update.edited_channel_post;

            const chat = message?.chat;

            if (
              !chat ||
              !["group", "supergroup", "channel"].includes(chat.type)
            ) {
              continue;
            }

            chats.set(String(chat.id), {
              id: chat.id,
              type: chat.type,
              title: chat.title ?? ""
            });
          }

          if (chats.size === 0) {
            throw new Error(
              "그룹 채팅을 찾지 못했습니다. 텔레그램 그룹에서 봇을 지정한 명령을 보낸 뒤 다시 실행하십시오."
            );
          }

          console.log("확인된 그룹 채팅:");

          for (const chat of chats.values()) {
            console.log(
              `CHAT_ID=${chat.id} | TYPE=${chat.type} | TITLE=${chat.title}`
            );
          }
          NODE